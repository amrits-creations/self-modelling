<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="sans-serif" font-size="13">

  <rect width="640" height="270" fill="#ffffff"/>

  <!-- main path: input -> hidden -> logits -->
  <rect x="20" y="40" width="120" height="56" rx="6" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="80" y="64" text-anchor="middle" font-weight="bold" fill="#1a1a1a">input x</text>
  <text x="80" y="82" text-anchor="middle" fill="#1a1a1a">784 (28×28 pixels)</text>

  <rect x="260" y="40" width="120" height="56" rx="6" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="320" y="64" text-anchor="middle" font-weight="bold" fill="#1a1a1a">hidden a</text>
  <text x="320" y="82" text-anchor="middle" fill="#1a1a1a">64 activations</text>

  <rect x="500" y="40" width="120" height="56" rx="6" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="560" y="64" text-anchor="middle" font-weight="bold" fill="#1a1a1a">logits</text>
  <text x="560" y="82" text-anchor="middle" fill="#1a1a1a">10 classes</text>

  <line x1="140" y1="68" x2="252" y2="68" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="58" text-anchor="middle" fill="#1a1a1a">fc1 + ReLU</text>

  <line x1="380" y1="68" x2="492" y2="68" stroke="#333" stroke-width="1.5"/>
  <text x="440" y="58" text-anchor="middle" fill="#1a1a1a">fc2</text>

  <!-- self-modelling branch: hidden -> a_hat -->
  <path d="M320,96 L320,198 L492,198" fill="none" stroke="#c9772b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="412" y="188" text-anchor="middle" fill="#8a4b12">self-model head</text>
  <text x="412" y="216" text-anchor="middle" fill="#8a4b12">removed after training</text>

  <rect x="500" y="170" width="120" height="56" rx="6" fill="#fdf1e3" stroke="#c9772b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="560" y="194" text-anchor="middle" font-weight="bold" fill="#1a1a1a">a_hat</text>
  <text x="560" y="212" text-anchor="middle" fill="#1a1a1a">64 (guess at a)</text>

  <polygon points="260,68 250,63 250,73" fill="#333"/>
  <polygon points="500,68 490,63 490,73" fill="#333"/>
  <polygon points="500,198 490,193 490,203" fill="#c9772b"/>

  <text x="20" y="256" fill="#1a1a1a">loss = cross-entropy(logits, label) + AW × MSE(a_hat, a)</text>
</svg>
